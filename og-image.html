<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8" />
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#fbf8f6;font-family:'Cormorant Garamond',Georgia,serif;color:#1c1a19;overflow:hidden}
  .outer{position:absolute;inset:26px;border:1px solid #e3ccd1;padding:8px}
  .inner{width:100%;height:100%;border:1px solid #f0e2e5;background:#fffefd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .kick{margin:0;font-family:'Jost',sans-serif;font-weight:300;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#8d4453}
  .row{display:flex;align-items:center;gap:44px}
  h1{margin:0;font-weight:400;font-size:86px;letter-spacing:.05em;line-height:1}
  .mono{position:relative;width:150px;height:150px;flex:none}
  .mono .a,.mono .b{position:absolute;width:66%;height:66%;border:1px solid #c98d9b;display:flex;align-items:center;justify-content:center;font-size:44px}
  .mono .a{left:0;top:0;border-radius:50% 50% 50% 8%;background:#fffefd}
  .mono .b{right:0;bottom:0;border-radius:8% 50% 50% 50%;background:transparent}
  .mono .amp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;background:#fffefd;padding:0 4px;z-index:2}
  .rule{display:flex;align-items:center;gap:16px;color:#8d4453}
  .rule i{display:block;width:110px;height:1px;background:#e3ccd1}
  .rule span{font-family:'Jost',sans-serif;font-weight:300;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
  .script{margin:0;font-family:'Pinyon Script',cursive;font-size:40px}
</style></head>
<body>
  <div class="outer"><div class="inner">
    <p class="kick">Bu özel günde</p>
    <div class="row">
      <h1>ÜLKÜ</h1>
      <div class="mono"><div class="a">Ü</div><div class="b">U</div><span class="amp">&amp;</span></div>
      <h1>UMUT</h1>
    </div>
    <div class="rule"><i></i><span>3 &amp; 6 Eylül 2026</span><i></i></div>
    <p class="script">Kdz. Ereğli &amp; Ankara</p>
  </div></div>
</body></html>
